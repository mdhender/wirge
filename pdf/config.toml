# PDF-only Hugo configuration.
#
# Use with:
#   hugo --config hugo.toml,pdf/config.toml --environment pdf
#
# This file is deliberately separate from hugo.toml so the normal website build
# does not gain extra outputs or PDF-specific behavior.

baseURL = "/"
relativeURLs = true
canonifyURLs = false

# The PDF manifest consumed by layouts/index.pdfhtml.html is generated under
# pdf/data by scripts/build_pdf.py.
dataDir = "pdf/data"

[params]
  [params.search]
    enable = false

[outputs]
  home = ["HTML", "PDFHTML"]

[outputFormats.PDFHTML]
  mediaType = "text/html"
  baseName = "book"
  path = "pdf"
  isHTML = true
  permalinkable = false
  noUgly = true

[mediaTypes."text/html"]
  suffixes = ["html"]
