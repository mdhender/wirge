# The docs are a static Hugo build served under the /docs path of
# epimethean.dev (matching the Hugo `baseURL` of https://epimethean.dev/docs).
#
# Deploy: the site is built on the server by /opt/wirge/deploy.sh (see
# deploy/README.md). Point this docs root at the build output by symlinking
# /var/www/epimethean/docs -> /opt/wirge/wirge/public. With `root` set to
# /var/www/epimethean, a request for /docs/... then resolves through the
# symlink to /opt/wirge/wirge/public/...

server {
    server_name epimethean.dev;
    root  /var/www/epimethean;   # / -> /var/www/epimethean/

    # Send bare /docs to /docs/ so relative asset paths resolve.
    location = /docs {
        return 301 /docs/;
    }

    # The documentation site (static Hugo output).
    location /docs/ {
        root  /var/www/epimethean;   # /docs/ -> /var/www/epimethean/docs/
        index index.html;            # serve index.html for directory URLs

        # Try the exact file, then the directory (index.html); otherwise 404.
        try_files $uri $uri/ =404;

        # Long-cache Hugo's fingerprinted assets; HTML stays revalidated.
        location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico|webp)$ {
            root       /var/www/epimethean;
            expires    30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Serve Hugo's generated 404 page for missing docs pages.
    error_page 404 /docs/404.html;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/epimethean.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/epimethean.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = epimethean.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    listen      [::]:80;
    server_name epimethean.dev;
    return 404; # managed by Certbot


}
