# Sample Nginx config for the Epimethean Challenge documentation site.
#
# The docs are a static Hugo build served under the /docs path of
# epimethean.dev (matching the Hugo `baseURL` of https://epimethean.dev/docs).
#
# Deploy: build with `hugo` and copy the CONTENTS of the generated `public/`
# directory to /var/www/epimethean/docs/ on the server. With `root` set to
# /var/www/epimethean, a request for /docs/... then resolves to
# /var/www/epimethean/docs/...
#
# This is a template — adjust paths, server_name, and TLS certificate
# locations for your environment.

# Redirect plain HTTP to HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name epimethean.dev;
    return      301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name epimethean.dev;

    # TLS — e.g. certificates issued by Let's Encrypt / certbot.
    ssl_certificate     /etc/letsencrypt/live/epimethean.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epimethean.dev/privkey.pem;

    # Send bare /docs to /docs/ so relative asset paths resolve.
    location = /docs {
        return 301 /docs/;
    }

    # The documentation site (static Hugo output).
    location /docs/ {
        root  /var/www/epimethean;   # /docs/ -> /var/www/epimethean/docs/
        index index.html;            # serve index.html for directory URLs

        # Try the exact file, then the directory (index.html); otherwise 404.
        try_files $uri $uri/ =404;

        # Long-cache Hugo's fingerprinted assets; HTML stays revalidated.
        location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico|webp)$ {
            root       /var/www/epimethean;
            expires    30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Serve Hugo's generated 404 page for missing docs pages.
    error_page 404 /docs/404.html;
}
